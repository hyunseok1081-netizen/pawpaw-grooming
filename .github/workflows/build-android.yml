name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 20 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Java 17 환경 세팅 (Capacitor 6 필수)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 프로젝트 패키지 설치 및 웹 빌드
        run: |
          npm install
          npm run build

      - name: 5. Capacitor 안드로이드 프로젝트 자동 생성 및 동기화
        run: |
          npx cap add android
          npx cap sync android

      - name: 6. Gradle 권한 부여 및 Debug APK 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. 완성된 APK 파일 업로드 (다운로드 가능하게 만들기)
        uses: actions/upload-artifact@v4
        with:
          name: pawpaw-grooming-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
